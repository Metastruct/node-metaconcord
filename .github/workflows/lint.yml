name: Lint

on:
    push:
        branches-ignore:
            - 'experiment/**'
    pull_request:
        branches-ignore:
            - 'experiment/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - id: lint
              run: npm run ci:lint
            - name: Display lint results
              if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') && hashFiles('eslint-results.sarif') != '' }}
              run: node scripts/sarif_to_annotation.ts
            - run: npm run test:fluxer
            - run: npm run schema:gen
            - name: Check generated schemas are up to date
              run: |
                  git diff --exit-code -- '**/handlers/structures/*.json' || {
                    echo "::error::Generated JSON schemas are out of date - run 'npm run schema:gen' and commit the result."
                    exit 1
                  }
            - name: Upload lint results to GitHub
              if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') && hashFiles('eslint-results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: eslint-results.sarif
